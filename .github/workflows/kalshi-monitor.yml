name: Kalshi AI Model Monitor

on:
  schedule:
    # Run every 5 minutes (GitHub Actions cron minimum), with a staggered
    # backup schedule offset by 2 minutes as a hedge against cron delays.
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send notification even if no changes (shows market summary)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Run without sending Discord messages"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kalshi-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state from cache
        uses: actions/cache/restore@v5
        with:
          path: .github/state/
          key: kalshi-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kalshi-state-${{ github.ref_name }}-
            kalshi-state-

      - name: Run Kalshi monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS="--loop --max-checks 10 --min-interval-seconds 30 --max-interval-seconds 45"

          if [ "${{ inputs.force_send }}" = "true" ]; then
            ARGS="$ARGS --force-send"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          python kalshi_monitor.py $ARGS

      - name: Save state to cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: .github/state/
          key: kalshi-state-${{ github.ref_name }}-${{ github.run_id }}
